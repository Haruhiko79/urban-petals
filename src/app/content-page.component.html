<app-site-header [back]="true"></app-site-header>
<ion-content><main class="content-page"><p class="eyebrow">{{ page['eyebrow'] }}</p><h1>{{ page['title'] }}</h1><p class="lead">{{ page['intro'] }}</p><div class="content-grid">@for (section of page['sections']; track section.title) {<ion-card><ion-card-content><h2>{{ section.title }}</h2><p>{{ section.body }}</p></ion-card-content></ion-card>}</div><ion-button routerLink="/tabs/tab2">Explore the collection</ion-button></main></ion-content>
