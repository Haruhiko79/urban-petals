<app-site-header></app-site-header><ion-header class="app-header"><ion-toolbar><ion-title>Urban Petals Admin</ion-title><ion-button slot="end" fill="clear" routerLink="/tabs/tab1">Storefront</ion-button></ion-toolbar></ion-header><ion-content><main class="admin-page"><nav><ion-button fill="solid" routerLink="/admin/dashboard">Dashboard</ion-button><ion-button fill="outline" routerLink="/admin/orders">Orders</ion-button><ion-button fill="outline" routerLink="/admin/products">Products</ion-button><ion-button fill="outline" routerLink="/admin/accounts">Accounts</ion-button></nav><p class="eyebrow">ADMINISTRATION</p><h1>Dashboard</h1><div class="cards-section"><div class="stat-card delivered"><div class="card-header"><p class="card-title">Delivered Orders</p></div><p class="card-number">{{ delivered() }}</p></div><div class="stat-card transit"><div class="card-header"><p class="card-title">In Transit Orders</p></div><p class="card-number">{{ transit() }}</p></div><div class="stat-card pending"><div class="card-header"><p class="card-title">Pending Orders</p></div><p class="card-number">{{ pending() }}</p></div><div class="stat-card cancelled"><div class="card-header"><p class="card-title">Cancelled/Rejected</p></div><p class="card-number">{{ cancelled() }}</p></div></div><div class="revenue"><p>Total Revenue</p><h2>PHP {{ revenue() | number:"1.2-2" }}</h2></div></main></ion-content>
