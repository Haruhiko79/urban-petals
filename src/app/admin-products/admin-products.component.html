<app-site-header></app-site-header><ion-header class="app-header"><ion-toolbar><ion-title>Urban Petals Admin</ion-title><ion-button slot="end" fill="clear" routerLink="/tabs/tab1">Storefront</ion-button></ion-toolbar></ion-header><ion-content><main class="admin-page"><nav><ion-button fill="outline" routerLink="/admin/dashboard">Dashboard</ion-button><ion-button fill="outline" routerLink="/admin/orders">Orders</ion-button><ion-button fill="solid" routerLink="/admin/products">Products</ion-button><ion-button fill="outline" routerLink="/admin/accounts">Accounts</ion-button></nav><p class="eyebrow">ADMINISTRATION</p><h1>Products</h1><div class="table-wrapper"><table class="products-table"><thead><tr><th>Item Code</th><th>Name</th><th>Category</th><th>Quantity</th><th>Price</th></tr></thead><tbody><tr *ngFor="let p of products()"><td>{{ p.item_code }}</td><td>{{ p.name }}</td><td>{{ p.category }}</td><td>{{ p.quantity }}</td><td>PHP {{ p.price | number:"1.2-2" }}</td></tr></tbody></table></div></main></ion-content>
