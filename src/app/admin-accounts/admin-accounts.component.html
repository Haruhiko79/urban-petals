<app-site-header></app-site-header><ion-header class="app-header"><ion-toolbar><ion-title>Urban Petals Admin</ion-title><ion-button slot="end" fill="clear" routerLink="/tabs/tab1">Storefront</ion-button></ion-toolbar></ion-header><ion-content><main class="admin-page"><nav><ion-button fill="outline" routerLink="/admin/dashboard">Dashboard</ion-button><ion-button fill="outline" routerLink="/admin/orders">Orders</ion-button><ion-button fill="outline" routerLink="/admin/products">Products</ion-button><ion-button fill="solid" routerLink="/admin/accounts">Accounts</ion-button></nav><p class="eyebrow">ADMINISTRATION</p><h1>Accounts</h1><div class="table-wrapper"><table class="accounts-table"><thead><tr><th>Employee ID</th><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th></tr></thead><tbody><tr *ngFor="let u of users()"><td>{{ u.employee_id }}</td><td>{{ u.first_name }} {{ u.last_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.department }}</td><td>{{ u.status }}</td></tr></tbody></table></div></main></ion-content>
