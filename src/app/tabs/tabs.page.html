<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="leaf-outline"></ion-icon>
      <ion-label>Shop</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="bag-handle-outline"></ion-icon>
      <ion-label>Bag</ion-label>
      @if (shop.count()) {
        <ion-badge aria-live="polite" [attr.aria-label]="shop.count() + ' items in bag'">{{ shop.count() }}</ion-badge>
      }
    </ion-tab-button>
    <ion-tab-button tab="account" href="/tabs/account">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>Account</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
