<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Petals — Payment received</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e7e0d1; color: #24331f;
         font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 24px; }
  .card { max-width: 420px; background: #f3eee3; border: 1px solid #d5cbb8; border-radius: 18px; padding: 32px 28px; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; color: #2e5f2e; }
  p { line-height: 1.55; margin: 0 0 18px; }
  button { border: 0; border-radius: 999px; background: #2e5f2e; color: #fff; padding: 12px 22px;
           font-size: 1rem; font-weight: 700; cursor: pointer; }
  small { display: block; margin-top: 14px; color: #6e8b62; }
</style>
</head>
<body>
  <main class="card">
    <h1 id="heading">Payment received</h1>
    <p id="detail">Thanks for your order! The Urban Petals app should already show it as paid. Return to the app now.</p>
    <small id="order-number"></small>
    <button id="return">Return to Urban Petals</button>
    <small>If nothing happens, open the Urban Petals app manually.</small>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var status = params.get('status') === 'failed' ? 'failed' : 'success';
      var order = (params.get('order') || '').replace(/[^A-Za-z0-9-]/g, '');
      var scheme = 'com.urbanpetals.app://payment/callback';
      var deepLink = scheme + '?status=' + status + (order ? '&order=' + encodeURIComponent(order) : '');
      if (status === 'failed') {
        document.getElementById('heading').textContent = 'Payment was not completed';
        document.getElementById('detail').textContent = 'No payment was taken. You can retry the GCash payment from the order screen in the app.';
      }
      if (order) document.getElementById('order-number').textContent = 'Order ' + order;
      document.getElementById('return').addEventListener('click', function () { window.location.href = deepLink; });
      setTimeout(function () { window.location.href = deepLink; }, 1500);
    })();
  </script>
</body>
</html>
