<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urban Petals – Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/Landingpage.css">
</head>
<body>

<div class="scene">

  <!-- Background atmosphere -->
  <div class="bg-layer"></div>
  <div class="grain"></div>
  <div class="orb"></div>

  <!-- Corner botanical decorations -->
  <svg class="corner-deco tl" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="40" cy="140" rx="18" ry="90" fill="#2e5f2e" opacity="0.6" transform="rotate(-35 40 140)"/>
    <ellipse cx="80" cy="110" rx="14" ry="70" fill="#4a8a4a" opacity="0.5" transform="rotate(-15 80 110)"/>
    <ellipse cx="120" cy="90" rx="12" ry="55" fill="#8fbc6a" opacity="0.3" transform="rotate(10 120 90)"/>
    <ellipse cx="55" cy="170" rx="10" ry="45" fill="#2e5f2e" opacity="0.4" transform="rotate(-55 55 170)"/>
    <ellipse cx="30" cy="200" rx="8" ry="35" fill="#4a8a4a" opacity="0.35" transform="rotate(-70 30 200)"/>
    <!-- Stem -->
    <path d="M 20 260 Q 60 180 100 100" stroke="#2e5f2e" stroke-width="2" opacity="0.5" fill="none"/>
  </svg>

  <svg class="corner-deco br" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="40" cy="140" rx="18" ry="90" fill="#2e5f2e" opacity="0.6" transform="rotate(-35 40 140)"/>
    <ellipse cx="80" cy="110" rx="14" ry="70" fill="#4a8a4a" opacity="0.5" transform="rotate(-15 80 110)"/>
    <ellipse cx="120" cy="90" rx="12" ry="55" fill="#8fbc6a" opacity="0.3" transform="rotate(10 120 90)"/>
    <ellipse cx="55" cy="170" rx="10" ry="45" fill="#2e5f2e" opacity="0.4" transform="rotate(-55 55 170)"/>
    <path d="M 20 260 Q 60 180 100 100" stroke="#2e5f2e" stroke-width="2" opacity="0.5" fill="none"/>
  </svg>

  <!-- Main content -->
  <div class="card">

    <!-- Logo SVG -->
    <svg class="logo-mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="37" fill="none" stroke="rgba(143,188,106,0.6)" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(143,188,106,0.3)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="40" y="16" text-anchor="middle" font-size="6.5" fill="#8fbc6a" font-family="Lato,sans-serif" font-weight="700" letter-spacing="2">URBAN</text>
      <g transform="translate(40,40)">
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(0) translate(0,-11)"/>
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(60) translate(0,-11)"/>
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(120) translate(0,-11)"/>
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(180) translate(0,-11)"/>
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(240) translate(0,-11)"/>
        <ellipse rx="3.5" ry="8" fill="#8fbc6a" transform="rotate(300) translate(0,-11)"/>
        <circle r="6" fill="#8fbc6a"/>
      </g>
      <text x="40" y="63" text-anchor="middle" font-size="6.5" fill="#8fbc6a" font-family="Lato,sans-serif" font-weight="700" letter-spacing="2">PETALS</text>
      <text x="40" y="73" text-anchor="middle" font-size="3.5" fill="rgba(143,188,106,0.6)" font-family="Lato,sans-serif" letter-spacing="0.8">YOUR GARDEN PARTNER</text>
    </svg>

    <p class="eyebrow">Welcome to</p>

    <h1>Urban<br><em>Petals</em></h1>

    <div class="divider"></div>

    <p class="tagline">
      Bringing nature closer to home. Discover curated plants,<br>
      premium tools, and everything your garden deserves.
    </p>

    <div class="cta-wrap">
      <a href="Homepage.html" class="cta-btn" id="enterBtn">
        Enter the Garden
        <span class="cta-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fbc6a" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </div>

  </div>


</div>

<!-- Fade overlay for page transition -->
<div class="fade-overlay" id="fadeOverlay"></div>
<script src="js/Landingpage.js"></script>
</body>
</html>
